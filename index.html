<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة الطلاب</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; padding: 20px; background: #f3f4f8; color: #1f2937; }
    .wrapper { max-width: 720px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(15,23,42,.08); margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 15px; }
    label span { color: #dc2626; }
    input, select { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; background: #fff; }
    .input-error { border-color: #dc2626 !important; background: #fef2f2 !important; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 6px; min-height: 18px; }
    .status-box { display: none; padding: 14px; border-radius: 10px; margin-bottom: 16px; font-weight: bold; font-size: 14px; }
    .status-error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }
    .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #4338ca; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .btn-secondary { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; background: #f9fafb; color: #374151; font-size: 15px; cursor: pointer; }
    h2 { margin: 0 0 6px; font-size: 22px; }
    .note { margin: 0 0 16px; color: #6b7280; font-size: 14px; }
    .hidden { display: none; }
    .home-header { background: #4338ca; color: #fff; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .home-header h1 { margin: 0 0 6px; font-size: 24px; }
    .home-header p { margin: 0; opacity: .9; }
    .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e7eb; font-size: 15px; }
    .info-row:last-child { border-bottom: none; }
    .info-row b { color: #6b7280; font-weight: normal; }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- صفحة الدخول -->
    <div id="loginView">
      <div class="card">
        <h2>دخول الطالب</h2>
        <p class="note">اكتب بياناتك بشكل صحيح للدخول إلى الصفحة الرئيسية.</p>
        <div id="statusBox" class="status-box"></div>

        <form id="studentForm" novalidate>
          <div class="field">
            <label for="fullName">الاسم الكامل <span>*</span></label>
            <input id="fullName" type="text" placeholder="مثال: أحمد محمود عبد الرحمن" />
            <div id="err-fullName" class="error-msg"></div>
          </div>
          <div class="field">
            <label for="studentId">الرقم الجامعي <span>*</span></label>
            <input id="studentId" type="text" inputmode="numeric" placeholder="مثال: 20261045" />
            <div id="err-studentId" class="error-msg"></div>
          </div>
          <div class="field">
            <label for="phone">رقم الهاتف <span>*</span></label>
            <input id="phone" type="tel" placeholder="مثال: 01012345678" />
            <div id="err-phone" class="error-msg"></div>
          </div>
          <div class="field">
            <label for="nationalOrEmail">الرقم القومي أو البريد الإلكتروني <span>*</span></label>
            <input id="nationalOrEmail" type="text" placeholder="رقم قومي 14 رقم أو بريد إلكتروني صحيح" />
            <div id="err-nationalOrEmail" class="error-msg"></div>
          </div>
          <div class="field">
            <label for="department">القسم / الكلية <span>*</span></label>
            <select id="department">
              <option value="">اختر القسم أو الكلية...</option>
              <option value="نظم المعلومات">نظم المعلومات</option>
              <option value="علوم الحاسب">علوم الحاسب</option>
              <option value="إدارة الأعمال">إدارة الأعمال</option>
              <option value="المحاسبة">المحاسبة</option>
            </select>
            <div id="err-department" class="error-msg"></div>
          </div>
          <div class="field">
            <label for="level">الفرقة / المستوى الدراسي <span>*</span></label>
            <select id="level">
              <option value="">اختر الفرقة / المستوى...</option>
              <option value="الفرقة الأولى">الفرقة الأولى</option>
              <option value="الفرقة الثانية">الفرقة الثانية</option>
              <option value="الفرقة الثالثة">الفرقة الثالثة</option>
              <option value="الفرقة الرابعة">الفرقة الرابعة</option>
            </select>
            <div id="err-level" class="error-msg"></div>
          </div>

          <button type="submit" class="btn-primary">دخول</button>
          <button type="reset" id="resetBtn" class="btn-secondary">تفريغ الحقول</button>
        </form>
      </div>
    </div>

    <!-- الصفحة الرئيسية (بعد الدخول) -->
    <div id="homeView" class="hidden">
      <div class="home-header">
        <h1 id="homeName"></h1>
        <p>مرحباً بك في الصفحة الرئيسية للمنصة</p>
      </div>
      <div class="card">
        <h2>بياناتي</h2>
        <div class="info-row"><b>الرقم الجامعي</b><span id="hId"></span></div>
        <div class="info-row"><b>رقم الهاتف</b><span id="hPhone"></span></div>
        <div class="info-row"><b>الرقم القومي / البريد</b><span id="hNat"></span></div>
        <div class="info-row"><b>القسم / الكلية</b><span id="hDept"></span></div>
        <div class="info-row"><b>الفرقة / المستوى</b><span id="hLevel"></span></div>
      </div>
      <button class="btn-secondary" id="logoutBtn">تسجيل الخروج</button>
    </div>

  </div>

  <script>
    const form = document.getElementById("studentForm");
    const statusBox = document.getElementById("statusBox");
    const fields = ["fullName", "studentId", "phone", "nationalOrEmail", "department", "level"];
    const SESSION_KEY = "student_session_v1";

    function clearErrors() {
      fields.forEach((id) => {
        document.getElementById(id).classList.remove("input-error");
        document.getElementById("err-" + id).textContent = "";
      });
      statusBox.className = "status-box";
      statusBox.textContent = "";
    }
    function setFieldError(id, msg) {
      document.getElementById(id).classList.add("input-error");
      document.getElementById("err-" + id).textContent = msg;
    }

    function validateForm() {
      clearErrors();
      let ok = true;
      const v = (id) => document.getElementById(id).value.trim();

      const fullName = v("fullName");
      const parts = fullName.split(/\s+/).filter(Boolean);
